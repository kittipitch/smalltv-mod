; PlatformIO project for smalltv-mod
; Three board targets, all a 1.54" 240x240 ST7789 IPS display:
;   env:smalltv       GeekMagic SmallTV,  ESP-12F (ESP8266)
;   env:smalltv_c2    knockoff SmallTV,   ESP32-C2 / ESP8684 (flashed over USB-C/CH340C)
;   env:smalltv_esp32 NMMiner NM-TV-154,  classic ESP32 (WROOM-32E)
;
; Build one:       pio run -e smalltv   /  pio run -e smalltv_c2  /  pio run -e smalltv_esp32
; Build artifact:  .pio/build/<env>/firmware.bin
; Flash via USB:   pio run -e <env> -t upload
; Flash via OTA:   upload firmware.bin through the device web UI (Update tab)
;
; License: WTFPL

[platformio]
default_envs = smalltv

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino

; ESP-12F on the SmallTV carries 4MB flash. Layout: 1MB LittleFS, rest for
; sketch + OTA (OTA needs room for two sketch copies).
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

monitor_speed = 115200
upload_speed = 921600

; Low-memory lwIP variant leaves more heap for BearSSL (HTTPS) + the framebuffer-less
; display rendering. Bandwidth is irrelevant for the tiny JSON payloads we fetch.
; Full BearSSL (no BEARSSL_SSL_BASIC), pinned to P-256 in BearSslTuning.cpp.
; The one remaining TLS consumer is the GitHub self-updater (OtaUpdate.cpp),
; which GitHub serves over the cheap static-RSA suites -- so a BEARSSL_SSL_BASIC
; build is probably possible now that the ticker's ECDHE-only cash.ch CDN is
; gone. Left as full BearSSL deliberately: changing it is a TLS behavior change
; that needs a real self-update test on hardware, not a drive-by flag flip.
; WITH_RADAR=0 in the BASE env, not just in the variants below -- every deployed
; unit is a dedicated Claude-usage meter, never a general-purpose gadget, so the
; plane radar (inherited from upstream's general SmallTV firmware) has no reason
; to ship in ANY image. Deliberately independent of WITH_TLS, which gates only
; the self-updater and should stay toggleable on its own.
; The stock ticker that used to sit alongside radar here was deleted outright
; ("we wanna remove the ticker feature"), along with its cash.ch/Yahoo/GitHub
; quote sources and the scheduled quotes workflow that fed it.
build_flags =
	-D SMALLTV_ESP8266
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0
	-D WITH_RADAR=0

; Feature folders on the include path so cross-module quote-includes resolve.
; These MUST be build_src_flags (project sources only), not build_flags — a global
; -Isrc leaks into the framework build and, on the ESP32 IDF, shadows internal
; headers like net.h/config.h (case-insensitively on Windows), breaking the build.
build_src_flags =
	-iquote src
	-iquote src/features/usage
	-iquote src/features/radar
	-iquote src/features/calendar

; The WITH_* flags above drop the feature's MODE from the registry, but its
; client still compiles unless excluded here: RadarClient.cpp is not internally
; guarded. Exclude the folder outright so its code never reaches the link.
; (extends = env:smalltv inherits this filter automatically in every child env.)
build_src_filter =
	+<*>
	-<features/radar/>

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0

; WITH_TLS defaults to 1 (unset) here -- the only remaining thing it gates is
; the GitHub self-updater. Set -D WITH_TLS=0 for a build that also drops
; self-update capability (see the slim envs below, whose reason is OTA
; flash-budget, not radar -- that is already gone here).

; ---------------------------------------------------------------------------
; Minimal OTA loader (src/loader.cpp). A tiny WiFi + web-OTA image, small
; enough to slip through a stock firmware whose updater rejects the full image
; for lack of space (e.g. the GeekMagic SmallTV-ultra). Flash it over the stock
; OTA, then flash the real firmware over the loader's /update. Pass WiFi at
; build time: -DLOADER_SSID='"MyNet"' -DLOADER_PASS='"secret"' (else it opens a
; SmallTV-Loader AP). build_src_filter compiles ONLY the loader.
; ---------------------------------------------------------------------------
[env:smalltv_loader]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
	-D LOADER_BUILD
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_filter = -<*> +<loader.cpp>

; ---------------------------------------------------------------------------
; ESP32-C2 / ESP8684 knockoff. Official espressif32 doesn't support the C2, so
; use the pioarduino fork (Arduino core 3.x / ESP-IDF 5.x). 4 MB flash: two OTA
; app slots + ~0.9 MB LittleFS (see partitions/smalltv_4mb_ota.csv). Flashed over
; the onboard CH340C on the USB-C port (auto-reset works, no button needed).
; ---------------------------------------------------------------------------
[env:smalltv_c2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c2-devkitm-1
framework = arduino

board_build.filesystem = littlefs
board_build.partitions = partitions/smalltv_4mb_ota.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; PlatformIO's bundled esptool hangs entering download mode on this board's CH340C.
; Flash the merged image with the system esptool instead (its auto-reset works).
; Needs a system Python with esptool installed (`pip install esptool`).
upload_protocol = custom
upload_command = python -m esptool --chip esp32c2 --baud 921600 write_flash 0x0 "$BUILD_DIR/firmware.factory.bin"

; WITH_RADAR=0 -- see [env:smalltv]'s own comment: every
; deployed unit is a dedicated Claude-usage meter, radar has no
; reason to ship anywhere, on any board.
build_flags =
	-D SMALLTV_ESP32C2
	-D ARDUINOJSON_USE_DOUBLE=0
	-D WITH_RADAR=0

build_src_flags =
	-iquote src
	-iquote src/features/usage
	-iquote src/features/radar
	-iquote src/features/calendar

; See [env:smalltv]'s own comment on why this filter, not just the WITH_*
; flags above, is needed.
build_src_filter =
	+<*>
	-<features/radar/>

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0

; ---------------------------------------------------------------------------
; NMMiner NM-TV-154 ("NM-TV-Miner" PCB): classic ESP32 (ESP32-D0WD-V3 in a
; WROOM-32E, 40 MHz crystal), same 1.54" ST7789 panel. Confirmed working on
; hardware by a community tester (issue #1); pin map from the vendor's
; custom-firmware guide. Same pioarduino platform as the C2 so both ESP32
; targets get Arduino core 3.x (Platform.h's ESP32 branch needs it). 4 MB
; flash (confirmed): same two-OTA-slots + LittleFS layout as the C2.
; First flash over USB: esptool write_flash 0x0 firmware.factory.bin
; ---------------------------------------------------------------------------
[env:smalltv_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.filesystem = littlefs
board_build.partitions = partitions/smalltv_4mb_ota.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; WITH_RADAR=0 -- see [env:smalltv]'s own comment: every
; deployed unit is a dedicated Claude-usage meter, radar has no
; reason to ship anywhere, on any board.
build_flags =
	-D SMALLTV_ESP32
	-D ARDUINOJSON_USE_DOUBLE=0
	-D WITH_RADAR=0

build_src_flags =
	-iquote src
	-iquote src/features/usage
	-iquote src/features/radar
	-iquote src/features/calendar

; See [env:smalltv]'s own comment on why this filter, not just the WITH_*
; flags above, is needed.
build_src_filter =
	+<*>
	-<features/radar/>

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0

; ---------------------------------------------------------------------------
; SD PRO (JUZIPi-tech) — vendor rebrand of the ESP8266 SmallTV cube.
;
; NOT the GeekMagic "SmallTV Pro", which is a classic ESP32 with 8MB flash and
; a touch button. This one is an ESP-12F/ESP8266 with 4MB, identified from the
; vendor image header (entry 0x4010f45c) and the literal string
; "Firmware ONLY supports ESP8266!!!" inside it.
;
; The only difference from [env:smalltv] is the flash layout: this matches the
; STOCK 4M2M map instead of our usual 4M1M, following the same approach
; upstream used for the GeekMagic Pro ("this firmware's partition layout
; matches stock, so the stock updater takes it directly").
;
; Layout was DERIVED, not guessed, from two observations on a live unit:
;   - GET /config reported "freespace":1253376 (LittleFS FREE). A 1MB
;     filesystem's TOTAL is ~1,003,520, so the FS cannot be 1MB -> not 4M1M.
;   - Its updater ACCEPTED a 723,194-byte upload. A 4M3M layout caps an OTA
;     image at 557,056 bytes (FS_start 0x100000 minus the ~491,520 rounded
;     vendor sketch) -> not 4M3M.
;   => 4M2M: FS_start 0x200000, ~2MB filesystem, OTA images up to ~1,605,632.
; ---------------------------------------------------------------------------
; SD PRO, and the Ultra's own [env:smalltv] above, are each now ONE build
; per device -- radar out (base env), TLS in. A separate "_slim"
; (TLS-off) variant used to exist for both boards; retired
; ("we will have one build created from slim + TLS and that's it we dont
; want to maintain more than one version per device"). TLS is kept because
; it's the only thing that makes the self-update button (now correctly
; pointed at this fork, see config.h's UPDATE_REPO_OWNER) actually usable
; on real hardware, and dropping ticker/radar already bought back enough
; flash budget to afford it: Ultra 699,429 B / SD PRO 693,029 B, both
; under the 716,800 B two-hop-update budget (with ~17-24 KB headroom --
; tighter than the old slim variant's ~137 KB, watch this on future growth).
[env:smalltv_sdpro]
extends = env:smalltv
board_build.ldscript = eagle.flash.4m2m.ld

; SDPRO_CS_GND: community teardowns of this cube report the panel's CS tied to
; GND with GPIO15 unused, same as the ESP32-C2 board. GPIO15 is a boot-strap
; pin -- held high at reset the chip boots SDIO and never runs the sketch, which
; matches the observed "powers on, no display, no WiFi, power cycle does not
; help". Leave GPIO15 alone.
;
; The stock updater performs NO free-space check (answers HTTP 200 to an
; image far larger than the space it has, writes past the end, eboot then
; copies a corrupt image to 0x0 -- that's what bricked two units at
; 718,224 B, the full smalltv image before ticker/radar removal). This
; build's own safety against THAT updater rests on a size CORRELATION, not
; this env's own link ceiling (1,044,464 B, from the 4M2M linker script,
; is NOT the stock updater's real OTA bound -- that would be
; ESP.getFreeSketchSpace() against the VENDOR's own flash layout, which is
; unmeasured and was never confirmed; a retracted version of exactly that
; arithmetic once sat in this comment as fact): the smalltv-mod-loader.bin
; trampoline (315,920 B) is smaller than the 488,304 B vendor image that
; installed successfully on this exact hardware, and the real firmware
; then goes through the LOADER's own stock Arduino updater (a genuine,
; verified check: ESP.getFreeSketchSpace() on OUR known 4m1m-equivalent
; layout), never through the vendor's unverified one. See
; journal/01-current-state.md ("TRIGGER IDENTIFIED" / the OTA-bound
; correction) and journal/05-howto.md section 5.8 for the full method.
build_flags =
	${env:smalltv.build_flags}
	-D SDPRO_CS_GND
