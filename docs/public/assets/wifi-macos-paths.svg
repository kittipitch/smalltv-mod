<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="On macOS, sharing Wi-Fi out over Wi-Fi is blocked. Working paths are Ethernet or iPhone USB into the Mac, then Internet Sharing out over Wi-Fi on channel 1, 6 or 11 to the device.">
  <rect width="880" height="330" rx="10" fill="#ffffff"/>
  <style>
    .t { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #16233a; }
    .s { font: 12.5px system-ui, sans-serif; fill: #4a5b78; }
    .box { fill: #f4f7fc; stroke: #c9d6ea; stroke-width: 1.5; }
    .bad { fill: #fdf0f0; stroke: #d98b8b; stroke-width: 1.5; }
    .ok { fill: #eef7f2; stroke: #8fd0b0; stroke-width: 1.5; }
    .arrow { stroke: #2e9367; stroke-width: 2.5; fill: none; marker-end: url(#g); }
    .xarrow { stroke: #c96b6b; stroke-width: 2.5; fill: none; marker-end: url(#r); stroke-dasharray: 6 4; }
    .lbl { font: 600 12px system-ui, sans-serif; fill: #6b7c99; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e9367"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c96b6b"/></marker>
  </defs>

  <text class="t" x="24" y="32" style="font-size:17px">macOS Internet Sharing: what works, and what macOS refuses</text>

  <rect class="ok" x="24" y="58" width="196" height="58" rx="8"/>
  <text class="t" x="46" y="82">Ethernet / USB-C dock</text>
  <text class="s" x="46" y="102">any wired uplink</text>

  <rect class="ok" x="24" y="130" width="196" height="58" rx="8"/>
  <text class="t" x="46" y="154">iPhone over USB</text>
  <text class="s" x="46" y="174">Personal Hotspot + cable</text>

  <path class="arrow" d="M224 87 H 316"/>
  <path class="arrow" d="M224 159 H 316"/>

  <rect class="box" x="320" y="76" width="200" height="94" rx="8"/>
  <text class="t" x="342" y="104">Your Mac</text>
  <text class="s" x="342" y="126">System Settings &#8594; General</text>
  <text class="s" x="342" y="144">&#8594; Sharing &#8594; Internet Sharing</text>
  <text class="s" x="342" y="162">To devices using: Wi-Fi</text>

  <path class="arrow" d="M524 123 H 620"/>
  <text class="lbl" x="530" y="112">Wi-Fi Options:</text>
  <text class="lbl" x="530" y="146">ch 1/6/11, WPA2</text>

  <rect class="ok" x="624" y="92" width="230" height="62" rx="8"/>
  <text class="t" x="646" y="118">SmallTV joins the 2.4 GHz</text>
  <text class="t" x="646" y="138">network your Mac hosts</text>

  <rect class="bad" x="24" y="212" width="496" height="86" rx="8"/>
  <text class="t" x="46" y="240">Blocked, on every band and every setting</text>
  <text class="s" x="46" y="264">Wi-Fi in &#8594; Wi-Fi out. One adapter cannot receive and re-broadcast,</text>
  <text class="s" x="46" y="284">so Wi-Fi is never offered as the source when you share to Wi-Fi.</text>

  <path class="xarrow" d="M330 255 H 520"/>
  <line x1="415" y1="238" x2="447" y2="272" stroke="#c96b6b" stroke-width="3"/>
  <line x1="447" y1="238" x2="415" y2="272" stroke="#c96b6b" stroke-width="3"/>

  <rect class="box" x="560" y="212" width="294" height="86" rx="8"/>
  <text class="t" x="582" y="240">Only real workaround: a second radio</text>
  <text class="s" x="582" y="264">A USB Wi-Fi dongle hosts the 2.4 GHz network</text>
  <text class="s" x="582" y="284">while the built-in card stays on your own Wi-Fi.</text>
</svg>
